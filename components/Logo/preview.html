<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Logo</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>
  body { margin: 0; padding: var(--s-300); background: var(--lavender-white); color: var(--ink); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--s-200); }
  .tile { display: grid; place-items: center; height: 120px; border-radius: var(--radius-lg); --logo-height: 30px; }
  .tile--lavender { background: var(--lavender); }
  .tile--white { background: var(--white); box-shadow: inset 0 0 0 1px var(--dot-grid); }
  .tile--night { background: var(--night); }
  .name { margin: 10px 0 2px; font: 700 14px/1.2 var(--font-brand); }
  .note { margin: 0; font: 400 13px/1.4 var(--font-sans); }
  .clear { margin-top: var(--s-300); display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-300); }
  .clear .hs-logo-clear { --logo-height: 40px; outline: 2px dashed var(--fire); outline-offset: -1px; background: var(--white); border-radius: 4px; }
</style>
</head>
<body>
  <div class="grid">
    <div><div class="tile tile--lavender"><span class="hs-logo hs-logo--ink" role="img" aria-label="Haysam"></span></div><p class="name">Ink</p><p class="note">Default. Lavender and white.</p></div>
    <div><div class="tile tile--white"><span class="hs-logo hs-logo--yellow-ink" role="img" aria-label="Haysam"></span></div><p class="name">Yellow + Ink</p><p class="note">Light grounds, yellow accent.</p></div>
    <div><div class="tile tile--night"><span class="hs-logo hs-logo--yellow-white" role="img" aria-label="Haysam"></span></div><p class="name">Yellow + White</p><p class="note">Night #270601.</p></div>
    <div><div class="tile tile--white"><span class="hs-logo hs-logo--black" role="img" aria-label="Haysam"></span></div><p class="name">Black</p><p class="note">One-colour print only.</p></div>
  </div>
  <div class="clear">
    <span class="hs-logo-clear"><span class="hs-logo hs-logo--ink" role="img" aria-label="Haysam"></span></span>
    <p class="note">Clear space: half the mark's height on every side. Smallest size: 32px tall on screen, 20mm wide in print.</p>
  </div>
</body>
</html>
