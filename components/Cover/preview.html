<!-- @dsCard height=288 -->
<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Haysam</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>
  html, body { margin: 0; }
  body { background: var(--canvas); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--canvas); }
  .cover svg { position: absolute; inset: 0; }
  .dot { fill: var(--dot-grid); }
  .slab { fill: var(--night); rx: var(--radius-card); }
  .trail { fill: var(--fire); }
  .head { fill: var(--yellow); }
  .blk-ink { fill: var(--ink); rx: var(--radius-card); }
  .relief { fill: var(--white); rx: var(--radius-card); }
  [data-theme="night"] .slab { fill: var(--ink); }
  [data-theme="night"] .blk-ink { fill: var(--metal-light); }
  .text { position: absolute; left: 40px; bottom: 32px; width: 440px; color: var(--text); }
  .name { margin: 0; font: 800 112px / 0.95 var(--font-brand); letter-spacing: -0.02em; }
  .tagline { margin: 8px 0 0; font: 400 14px / 1.4 var(--font-ui); }
</style>
</head>
<body>
  <div class="cover">
    <!--
      blocks: night slab 168×328 (radius-card), yellow pill 264×72 (radius-pill), fire pill 136×48, ink block 168×104 (radius-card), white relief 96×96 (radius-card)
      arrangement: one tall night slab bleeding top and bottom, crossed by the comet (fire trail under a yellow head), ink and white satellites to the right
      pattern: dot grid, the brand's own carousel ground; precise and mono, so a dot grid at one spacing step
      scales: dot pitch space-l (48), dot radius 2, block corners radius-card (20), pills half their height
    -->
    <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
      <g id="dots"></g>
      <rect class="slab" x="600" y="-20" width="168" height="328" rx="20"/>
      <rect class="trail" x="592" y="124" width="136" height="48" rx="24"/>
      <rect class="head" x="664" y="112" width="264" height="72" rx="36"/>
      <rect class="blk-ink" x="816" y="-20" width="168" height="104" rx="20"/>
      <rect class="relief" x="840" y="208" width="96" height="96" rx="20"/>
    </svg>
    <div class="text">
      <p class="name">Haysam</p>
      <p class="tagline">AI darslari, qo‘llanmalar va AI vositalari haqida yangiliklar.</p>
    </div>
  </div>
  <script>
    const g = document.getElementById('dots');
    const ns = 'http://www.w3.org/2000/svg';
    for (let x = 504; x <= 936; x += 48) {
      for (let y = 24; y <= 264; y += 48) {
        const c = document.createElementNS(ns, 'circle');
        c.setAttribute('class', 'dot');
        c.setAttribute('cx', x);
        c.setAttribute('cy', y);
        c.setAttribute('r', 2);
        g.appendChild(c);
      }
    }
  </script>
</body>
</html>
