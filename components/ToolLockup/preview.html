<!-- @dsCard group="Brand" height=200 subtitle="HAYSAM × tool, one line" -->
<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Tool lockup</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>
  body { margin: 0; display: grid; gap: var(--space-s); padding: var(--space-m); background: var(--lavender-white); font-family: var(--font-ui); }
  .row { display: flex; align-items: center; justify-content: center; min-height: 72px; padding: 0 var(--space-m); border-radius: var(--radius-card); --logo-height: 30px; overflow: hidden; }
  .row--lavender { background: var(--lavender); }
</style>
</head>
<body>
  <div class="row row--lavender">
    <span class="hs-lockup">
      <span class="hs-logo hs-logo--ink" role="img" aria-label="Haysam"></span>
      <span class="hs-lockup__x" aria-hidden="true">×</span>
      <span class="hs-lockup__name">Google Veo</span>
    </span>
  </div>
  <div class="row" data-theme="night" style="background: var(--night)">
    <span class="hs-lockup">
      <span class="hs-logo hs-logo--auto" role="img" aria-label="Haysam"></span>
      <span class="hs-lockup__x" aria-hidden="true">×</span>
      <span class="hs-lockup__name">Google Veo</span>
    </span>
  </div>
</body>
</html>
