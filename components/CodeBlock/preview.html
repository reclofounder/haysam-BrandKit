<!doctype html>
<html lang="uz">
<head>

<title>CodeBlock</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>
  body { margin: 0; padding: var(--s-300); }
  .stack { display: flex; flex-direction: column; gap: var(--s-75); }

<body class="hs-ui">
<div class="stack">
  <p class="body-4">Plaginni o'rnating</p>
