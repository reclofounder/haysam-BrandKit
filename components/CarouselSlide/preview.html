<!-- @dsCard group="Formats" height=580 subtitle="1080×1350 slide on lavender with the dot grid" -->
<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Carousel slide</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>
  body { margin: 0; display: flex; justify-content: center; padding: var(--space-m); background: var(--lavender-white); }
  .slide { border-radius: 48px; box-shadow: inset 0 0 0 2px var(--dot-grid); }
  .slide .stack { position: absolute; top: 64px; left: var(--space-xl); right: var(--space-xl); display: flex; flex-direction: column; align-items: center; text-align: center; }
  .slide .hs-chip { margin-top: 44px; }
  /* Fit the longest line to the 936px text width: 172px here. */
  .slide h1 { margin: 40px 0 0; font-size: 172px; text-transform: uppercase; }
  .slide .sub { margin: 12px 0 0; }
  /* Tool tiles frame the open centre, where the slide's one 3D object goes. */
  .slide .hs-tile { position: absolute; color: var(--ink); font: 600 28px / 1.1 var(--font-ui); text-align: center; }
  .slide > .hs-tile:nth-of-type(1) { left: 96px; top: 660px; rotate: -6deg; }
  .slide > .hs-tile:nth-of-type(2) { left: 76px; top: 950px; rotate: 5deg; }
  .slide > .hs-tile:nth-of-type(3) { left: 460px; top: 1110px; rotate: -3deg; }
  .slide > .hs-tile:nth-of-type(4) { right: 88px; top: 680px; rotate: 6deg; }
  .slide > .hs-tile:nth-of-type(5) { right: 72px; top: 960px; rotate: -5deg; }
</style>
</head>
<body>
  <div class="hs-artboard hs-artboard--feed hs-canvas--dots slide">
    <div class="stack">
      <span class="hs-logo hs-logo--ink" role="img" aria-label="Haysam"></span>
      <span class="hs-chip">Bir xil ishlarga ko‘p vaqt ketyaptimi?</span>
      <h1 class="headline-news">5 ta AI vosita</h1>
      <p class="sub subline">ishingizni osonlashtiradi</p>
    </div>
    <span class="hs-tile">ChatGPT</span>
    <span class="hs-tile">Gemini</span>
    <span class="hs-tile">Claude</span>
    <span class="hs-tile">Canva</span>
    <span class="hs-tile">Grammarly</span>
  </div>

  <script>
    const fit = () => {
      const w = document.documentElement.clientWidth - 48;
      document.documentElement.style.setProperty('--hs-scale', Math.max(0.15, Math.min(0.39, w / 1080)).toFixed(4));
    };
    fit();
    addEventListener('resize', fit);
  </script>
</body>
</html>
