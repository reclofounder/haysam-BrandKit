<!-- @dsCard group="Formats" height=620 subtitle="1080×1920 tool hero, with the safe band and Reels UI zones" -->
<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Reels cover</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>
  body { margin: 0; display: flex; justify-content: center; gap: var(--space-m); padding: var(--space-m); background: var(--lavender-white); }
  .cover { flex: none; background: var(--canvas); color: var(--text); border-radius: 48px; }
  .cover .hs-comet { width: 1400px; left: -560px; top: 330px; --hs-comet-angle: 18deg; }
  .cover .top { position: absolute; top: calc(var(--logo-y) - var(--logo-height) / 2); left: 0; right: 0; display: flex; justify-content: center; }
  .cover .stack { position: absolute; top: 820px; left: var(--space-xl); right: var(--space-xl); display: flex; flex-direction: column; align-items: center; text-align: center; }
  /* Fit the longest line to the 936px text width: 184px keeps this on two lines. */
  .cover h1 { margin: 0; font-size: 184px; text-transform: uppercase; }
  .cover .hs-sticker { margin-top: 28px; }
</style>
</head>
<body>
  <div class="hs-artboard hs-artboard--story cover" data-theme="night">
    <div class="hs-comet"></div>
    <div class="top">
      <span class="hs-lockup">
        <span class="hs-logo hs-logo--auto" role="img" aria-label="Haysam"></span>
        <span class="hs-lockup__x" aria-hidden="true">×</span>
        <span class="hs-lockup__name">Google Veo</span>
      </span>
    </div>
    <div class="stack">
      <h1 class="headline-cinema">Veo’da video yasash</h1>
      <span class="hs-sticker">AI video</span>
    </div>
  </div>

  <div class="hs-artboard hs-artboard--story cover" data-theme="night">
    <div class="hs-comet"></div>
    <div class="top">
      <span class="hs-lockup">
        <span class="hs-logo hs-logo--auto" role="img" aria-label="Haysam"></span>
        <span class="hs-lockup__x" aria-hidden="true">×</span>
        <span class="hs-lockup__name">Google Veo</span>
      </span>
    </div>
    <div class="stack">
      <h1 class="headline-cinema">Veo’da video yasash</h1>
      <span class="hs-sticker">AI video</span>
    </div>
    <div class="hs-guides" aria-hidden="true">
      <div class="hs-guides__safe"></div>
      <div class="hs-guides__ui-right"></div>
      <div class="hs-guides__ui-bottom"></div>
    </div>
  </div>

  <script>
    const fit = () => {
      const w = document.documentElement.clientWidth - 56;
      const s = Math.min(0.3, (w - 24) / (1080 * 2));
      document.documentElement.style.setProperty('--hs-scale', Math.max(0.12, s).toFixed(4));
    };
    fit();
    addEventListener('resize', fit);
  </script>
</body>
</html>
