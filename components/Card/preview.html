<!-- @dsCard group="Content" height=300 subtitle="Feature cards with icon tiles" -->
<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Card</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>
  body { margin: 0; padding: var(--s-300); }
  .hs-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
</style>
</head>
<body class="hs-ui">
<div class="hs-grid">
  <article class="hs-card">
    <span class="hs-icon-tile"><i class="hs-i hs-i--lightbulb" aria-hidden="true"></i></span>
    <h3 class="title-1">G'oya ma'nodan</h3>
    <p class="body-6">Sarlavha va bitta gapdan metafora topadi, keyin unga mos layoutni tanlaydi.</p>
  </article>
  <article class="hs-card">
    <span class="hs-icon-tile"><i class="hs-i hs-i--shuffle" aria-hidden="true"></i></span>
    <h3 class="title-1">Har post boshqacha</h3>
    <p class="body-6">Oxirgi uchta muqovadagi layout, fon, shrift va rang takrorlanmaydi.</p>
  </article>
  <article class="hs-card">
    <span class="hs-icon-tile"><i class="hs-i hs-i--seal-check" aria-hidden="true"></i></span>
    <h3 class="title-1">Faqat rasmiy logolar</h3>
    <p class="body-6">Tool logolari rasmiy fayldan olinadi. Logo hech qachon chizilmaydi.</p>
  </article>
</div>
</body>
</html>
